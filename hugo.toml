baseURL = "https://gfrm.in"
title = "Guy Freeman"
locale = "en"
defaultContentLanguage = "en"

[params]
  description = "Guy Freeman — Bayesian statistician and ML researcher working on principled agent architecture. PhD in Statistics (Warwick). 1,750+ citations. Production AI at scale."
  author = "Guy Freeman"
  ogImage = "images/og-default.png"
  twitterHandle = "gfrm_in"
  formspreeId = "mgeqrkaq"

[params.social]
  twitter = "https://twitter.com/gfrm_in"
  mastodon = "https://defcon.social/@gfrmin"
  github = "https://github.com/gfrmin"
  linkedin = "https://linkedin.com/in/guyfreemanstat"
  scholar = "https://scholar.google.com/citations?hl=en&user=H422hdkAAAAJ"

[languages]
  [languages.en]
    weight = 1
    direction = "ltr"
  [languages.he]
    weight = 2
    direction = "rtl"
    title = "גיא פרימן"

[taxonomies]
  category = "categories"
  series = "series"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "Series"
    url = "/series/"
    weight = 3
  [[menu.main]]
    name = "Research"
    url = "/research/"
    weight = 4
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 5
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 6

[related]
  includeNewer = true
  threshold = 30
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.highlight]
    style = "monokailight"
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    # Mathematics. A bare `$` is deliberately NOT an inline delimiter: the prose
    # is full of dollar amounts ($200,000 and the like). Inline math is \(...\).
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block  = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "index"

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepEndTags = false
    [minify.tdewolff.js]
      keepVarNames = true
      precision = 0
      version = 0
