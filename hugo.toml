baseURL = "https://gfrm.in"
title = "Guy Freeman"
locale = "en"
defaultContentLanguage = "en"

[params]
  description = "Guy Freeman — statistician working on the evaluation and oversight of AI systems: how to score an agent no human watches, and how to govern one allowed to rewrite itself. Author of A Court for Agents. PhD Statistics (Warwick), 1,750+ citations. Hong Kong."
  author = "Guy Freeman"
  ogImage = "images/og-default.png"
  twitterHandle = "gfrm_in"
  formspreeId = "mgeqrkaq"

[params.social]
  twitter = "https://twitter.com/gfrm_in"
  mastodon = "https://defcon.social/@gfrmin"
  github = "https://github.com/gfrmin"
  linkedin = "https://linkedin.com/in/guyfreemanstat"
  scholar = "https://scholar.google.com/citations?hl=en&user=H422hdkAAAAJ"

[languages]
  [languages.en]
    weight = 1
    direction = "ltr"
  [languages.he]
    weight = 2
    direction = "rtl"
    title = "גיא פרימן"
    # Per-language params override the shared [params] block. Without this the
    # Hebrew pages fell back to the English bio for their meta description, and
    # the Hebrew RSS channel described itself in English.
    [languages.he.params]
      description = "גיא פרימן — סטטיסטיקאי העוסק בהערכה ובפיקוח על מערכות בינה מלאכותית: איך מדרגים סוכן שאיש אינו משגיח עליו, ואיך מושלים בסוכן שמותר לו לשכתב את עצמו. מחבר A Court for Agents. דוקטורט בסטטיסטיקה (וורוויק), מעל 1,750 ציטוטים. הונג קונג."

# The Hugo version is pinned so local builds and CI produce identical output.
# Single source of truth is `.hugo-version`, which the publish workflow reads and
# then asserts against the binary it installed. The `min` below is the dev-side
# half: too old a local Hugo prints a WARN on every build and `hugo server` start
# (it is only a warning — Hugo does not treat this as fatal). Bump both together.
[module]
  [module.hugoVersion]
    min = "0.165.0"
    extended = true

[taxonomies]
  category = "categories"
  series = "series"

# Menus are per-language. A single shared [menu] block emitted English labels
# pointing at English URLs on the Hebrew pages too, so every nav click threw a
# Hebrew reader back onto the English site. The Hebrew menu lists only what
# actually exists in Hebrew; the language toggle in the header crosses over.
[languages.en.menu]
  [[languages.en.menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[languages.en.menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[languages.en.menu.main]]
    name = "Series"
    url = "/series/"
    weight = 3
  [[languages.en.menu.main]]
    name = "Research"
    url = "/research/"
    weight = 4
  # /book/ is not Hugo content: publish.yml builds it from gfrmin/agent-court
  # (mdBook) into public/book/. English only, so it is absent from the Hebrew
  # menu, as the archive and the tab row are.
  # identifier = "book" is load-bearing: layouts/partials/book-url.html reads
  # this entry for the homepage and 404 links and fails the build if it is
  # missing, so this is the one place /book/ is written.
  [[languages.en.menu.main]]
    identifier = "book"
    name = "Book"
    url = "/book/"
    weight = 5
  [[languages.en.menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 6
  [[languages.en.menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 7

[languages.he.menu]
  [[languages.he.menu.main]]
    name = "ראשי"
    url = "/he/"
    weight = 1
  [[languages.he.menu.main]]
    name = "רשומות"
    url = "/he/posts/"
    weight = 2
  [[languages.he.menu.main]]
    name = "סדרות"
    url = "/he/series/"
    weight = 3

[related]
  includeNewer = true
  threshold = 30
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.highlight]
    style = "monokailight"
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    # Mathematics. A bare `$` is deliberately NOT an inline delimiter: the prose
    # is full of dollar amounts ($200,000 and the like). Inline math is \(...\).
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block  = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[outputs]
  # SearchIndex is the client-side search corpus (layouts/index.searchindex.json),
  # emitted once per language at /search-index.json and /he/search-index.json.
  # BookHead is the <head> fragment for the mdBook build of /book/
  # (layouts/index.bookhead.html); publish.yml inserts it into every built book
  # page (scripts/inject-book-head.py) and deletes it from public/. See "The
  # book" in CLAUDE.md.
  home = ["HTML", "RSS", "SearchIndex", "BookHead"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "index"

  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    # Without this, baseof.html's `range .AlternativeOutputFormats` would advertise
    # the corpus to feed readers as a <link rel="alternate"> beside the RSS one.
    notAlternative = true

  [outputFormats.BookHead]
    mediaType = "text/html"
    baseName = "book-head"
    isPlainText = true
    notAlternative = true

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepEndTags = false
    [minify.tdewolff.js]
      keepVarNames = true
      precision = 0
      version = 0
