{{ define "main" }}
<main class="content {{ if eq .Language.Direction "rtl" }}rtl-content{{ end }}">
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  <div class="post-listing">
    {{ range .Pages.ByDate.Reverse }}
    {{ partial "post-card.html" (dict "post" . "level" 2 "full" true) }}
    {{ end }}
  </div>
</main>
{{ end }}
