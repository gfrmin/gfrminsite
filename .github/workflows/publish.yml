name: Publish to GitHub Pages

on:
  push:
    branches: [master]
  # Build every pull request too, so master can require a green build before a
  # merge; only a push to master deploys.
  pull_request:
  workflow_dispatch:
  # The book at /book/ is built from gfrmin/agent-court at deploy time (see the
  # "Build the book" step), so it refreshes when that repository asks and once a
  # night regardless.
  repository_dispatch:
    types: [book-updated]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# A pull request builds in its own group: in the shared "pages" group a PR build
# could replace a queued deploy, since a group keeps only one pending run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve pinned Hugo version
        id: hugo
        run: echo "version=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      - name: Assert Hugo version matches the pin
        run: |
          want="${{ steps.hugo.outputs.version }}"
          got="$(hugo version | sed -n 's/^hugo v\([0-9.]*\).*/\1/p')"
          echo "pinned=$want installed=$got"
          [ "$want" = "$got" ] || { echo "::error::Hugo $got installed but .hugo-version pins $want"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: hugo --minify

      # The book — "A Court for Agents", gfrmin/agent-court — lives at /book/.
      # Its source stays in that repository; this step checks it out and builds
      # its chapters/ with mdBook into public/book/, so there is one source of
      # truth and nothing copied by hand. Hugo owns nothing under /book/.
      - name: Check out the book
        uses: actions/checkout@v6
        with:
          repository: gfrmin/agent-court
          path: .book-src

      - name: Build the book into /book/
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./mdbook --version
          MDBOOK_OUTPUT__HTML__SITE_URL=/book/ ./mdbook build .book-src
          rm -rf public/book && cp -r .book-src/book-site public/book
          test -f public/book/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
