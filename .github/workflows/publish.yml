name: Publish to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve pinned Hugo version
        id: hugo
        run: echo "version=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      - name: Assert Hugo version matches the pin
        run: |
          want="${{ steps.hugo.outputs.version }}"
          got="$(hugo version | sed -n 's/^hugo v\([0-9.]*\).*/\1/p')"
          echo "pinned=$want installed=$got"
          [ "$want" = "$got" ] || { echo "::error::Hugo $got installed but .hugo-version pins $want"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
