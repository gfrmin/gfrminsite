  alt: "accessinfo.hk screenshot"
  description: "Hong Kong's Freedom of Information platform: citizens file requests to government bodies and track the replies in the open. Every exchange stays on the public record, accreting a searchable archive of what officials will and won't disclose. Built on Alaveteli."
  weight: 40
  featured: true
  hero: false

- title: "Webb Data"
