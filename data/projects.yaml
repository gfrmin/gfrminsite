  hero: false

- title: "Scalibur"
  url: "https://github.com/gfrmin/scalibur"
  image: "/images/scalibur.png"
  alt: "Scalibur screenshot"
  description: "A Python tool that frees your weight data from cheap Bluetooth bathroom scales. It reverse-engineers the BLE protocol, reads the raw impedance measurement, and derives the body-fat, muscle-mass, and metabolic figures the vendor app keeps behind its own walls — built to sit on a Raspberry Pi and log every weigh-in automatically."
  weight: 60
  featured: false
  hero: false

- title: "Jarvis Lite"
