- title: "bayesian-agent"
  url: "https://github.com/gfrmin/bayesian-agent"
  image: "/images/bayesian-agent.png"
  alt: "bayesian-agent screenshot"
  description: "A simulation framework for agents that learn to navigate an unknown environment by reasoning about their own uncertainty. It pairs Bayesian inference with Thompson sampling to balance exploration against exploitation — a compact demonstration of online probabilistic learning."
