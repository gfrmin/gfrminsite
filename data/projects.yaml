- title: "doorplate.dev"
  kind: "use"
  url: "https://doorplate.dev"
  description: "Resolve a Hong Kong address written any way a person might write it — English, Traditional or Simplified Chinese, mixed, abbreviated, misspelt, in any order — to the premises it names in the government gazetteer. A text is treated as a noisy rendering of the name of a place: the resolver computes the posterior over which place, returns the Bayes act under a loss the caller may replace, and asks a clarifying question only when the value of that information pays. On real-world text from company filings, forums and listings it answers 89.5% right and 3.8% wrong; on 25,000 synthetic round trips, 92.1% right and 0.1% wrong; 99.7% of non-addresses are refused. Python, over the hkaddresses library in the Renavon monorepo."
  weight: 55
  featured: true
  hero: false

