# Single source of truth for projects. Rendered into:
#   - the homepage (layouts/index.html): `hero: true` -> a full-width project-row;
#     `featured: true` -> the project-card grid beneath it
#   - /projects/ (layouts/projects/list.html): every entry as a project-row, in two
#     groups by `kind`, each group ordered by `weight`
# `kind` splits /projects/ into what a reader can DO with each entry: `use` is live
# and hosted (opens in a browser), `code` is a repository to read or run. Every
# entry needs one — projects/list.html fails the build if the two groups do not
# add up to the whole file, because a typo would otherwise drop a project silently.
# Omit `image` to render a text-only card (a top accent rule, no empty image well).
# `alt: ""` marks a decorative image — five of these are generated gradient title cards
# showing only the project name, so describing them would just repeat the heading.
# English-only: there is no Hebrew projects data, so the homepage grid is skipped on /he/.

- title: "Kana Derivation Chart"
  kind: "use"
  url: "https://kana.gfrm.in"
  image: "/images/kana.png"
  alt: "Kana derivation chart showing hiragana and katakana with their source kanji"
  description: "An interactive map of how Japan's two phonetic alphabets grew out of kanji. All 46 basic syllables sit in a grid by consonant and vowel, colour-coded by script; click any cell to trace both descents from the shared source character — the cursive simplification that produced hiragana and the component extraction that produced katakana — with notes on archaic kana and the voiced dakuten variants. React and Vite, hosted on Cloudflare Pages."
  weight: 10
  featured: true
  hero: false

- title: "jack"
  kind: "code"
  url: "https://github.com/renavondata/jack"
  description: "A court for an agent that is allowed to change itself. At its centre is an append-only, hash-chained, signed record; a 450-line checker that accepts or refuses each entry; and a judge that runs the checker over every pull request and refuses what breaks the law. The parties are one person and several language-model sessions, and every suggestion any of them makes is a forecast scored by log-loss against a base rate, resolved by someone else from saved evidence. The system is built in layers, each tried in a window whose pass mark is written down before it opens and tested by betting, so an operator may look whenever he likes. The agent that will rewrite its own programs arrives at layer C3; what exists now is the court that will judge it, and the book about it, A Court for Agents, recomputes every number from the record. Python, standard library only in the kernel."
  weight: 12
  featured: false
  hero: true

- title: "proplang"
  kind: "code"
  url: "https://github.com/gfrmin/proplang"
  description: "A small language built on one claim: an adaptive Bayesian decision-theoretic agent needs no adaptation machinery. If hypotheses are programs and the prior is 2^-|program| under a grammar, then adaptivity, bounded rationality, and inductive bias stop being modules and become posterior dynamics — so the alphabet of the language is the prior, and the design method is to delete every terminal whose removal costs no capability. Ten terminals survived an executed deletion audit; one failed its own proof and is recorded as a standing bug rather than quietly kept. The repository is a closed, frozen artifact: the acceptance tests were written and cryptographically signed before any implementation existed, and the reference implementation and its Haskell port were built against that frozen oracle by an agent that could not change the tests. Python and Haskell."
  weight: 15
  featured: true
  hero: false

- title: "Credence"
  kind: "code"
  url: "https://github.com/gfrmin/credence"
  description: "A Bayesian agent framework that treats tool selection as a decision problem rather than a prompt-engineering one: a Beta posterior over each tool's reliability, and before every call the expected value of the information the call would buy. Its announced headline — a twelve-fold win over LangChain ReAct — did not survive a fair benchmark: hand the agent the question's category and it wins, infer the category and a one-line greedy ablation beats it. The paper was withdrawn and the record of why published instead. What survived is a law, not a victory: the value of exploration depends on the quality of attribution, +27 with clean categories and −12 with inferred ones. The predecessor to proplang, which cornered its foundation. Julia, with Python tooling."
  weight: 20
  featured: false
  hero: false

- title: "life-agent"
  kind: "code"
  url: "https://github.com/gfrmin/life-agent"
  description: "The composition root for a personal life-management agent — an assistant that remembers your whole digital life, reasons under uncertainty, and acts across your tools. It reinvents nothing: every capability is wired in as an MCP server, so memory (pkm), the Bayesian governor (credence-pi), the agent runtime (pi-mono), and GTD tasks (jarvis-lite) compose into a single application, leaving the interface a swappable detail. Ask a question and it answers from your own corpus, with citations — and nothing personal ever enters the repo. TypeScript over a polyglot TS/Python/Julia stack."
  weight: 22
  featured: true
  hero: false

- title: "credence-pi"
  kind: "code"
  url: "https://github.com/gfrmin/credence/tree/master/apps/credence-pi"
  description: "A Bayesian governance layer that decides which of a coding agent's tool calls to allow, block, or pause for human approval — and learns where the line sits from the agent's own behaviour. The design splits into a body and a brain: a TypeScript body hooks the agent's tool_call event and reports a handful of declared features, while a Julia brain holds a Beta posterior over P(approve) and chooses an action by expected value of information, so asking the human wins exactly when the uncertainty is worth the interruption. The wire between them carries only observations and named actions, leaving the brain free to grow more sophisticated without the body ever needing to change. Julia (BDSL) and TypeScript."
  weight: 25
  featured: true
  hero: false

- title: "pkm"
  kind: "code"
  url: "https://github.com/gfrmin/life-agent/tree/master/src/pkm"
  description: "A content-addressed extraction cache and catalogue for personal knowledge management. It ingests documents, routes each through a format-appropriate extractor — pandoc, docling, unstructured — and writes the results to an append-only content-addressed store indexed by DuckDB. Cache keys are derived deterministically from the input hash and the producer's name, version, and config, so re-running is a no-op and every artifact stays reproducible and reconstructible. Python; the retrieval substrate beneath life-agent, now developed inside the life-agent monorepo as src/pkm."
  weight: 27
  featured: true
  hero: false

